<!DOCTYPE html>
<!--
    EZ AutoRefresh - 弹出窗口界面
    ==============================
    提供自动刷新配置的用户界面，包括：
    - 刷新模式选择（固定时间 / 随机时间）
    - 时间参数配置（时/分/秒）
    - 启动/停止/停止全部操作按钮
    - 当前运行任务的列表展示（含倒计时、编辑功能）
-->
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <!-- 引入弹出窗口样式 -->
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <!-- ============================================================
    状态栏：显示当前正在运行的刷新任务数量
    ============================================================ -->
    <div id="status">
        当前运行任务：0
    </div>

    <!-- ============================================================
    刷新模式选择：固定时间 / 随机时间
    ============================================================ -->
    <div class="mode-card">
        <div class="mode-title">
            刷新模式
        </div>
        <label class="radio-label">
            <input type="radio" name="mode" value="fixed" checked>
            固定时间
        </label>
        <label class="radio-label">
            <input type="radio" name="mode" value="random">
            随机时间
        </label>
    </div>

    <!-- ============================================================
    固定时间配置面板（默认显示）
    用户设置固定的刷新间隔：时/分/秒
    ============================================================ -->
    <div id="fixed-box" class="config-card">
        <div class="section-title">
            固定时间
        </div>
        <input id="fixed-hour" type="number" min="0" value="0"> 时
        <input id="fixed-minute" type="number" min="0" value="3"> 分
        <input id="fixed-second" type="number" min="0" value="0"> 秒

    </div>

    <!-- ============================================================
    随机时间配置面板（默认隐藏，选择随机模式时显示）
    用户设置随机刷新范围：最小 ~ 最大，每次在范围内随机选取间隔
    ============================================================ -->
    <div id="random-box" class="config-card" style="display:none">
        <div class="section-title">
            随机时间范围
        </div>
        <div class="row">
            最小：
            <input id="min-hour" type="number" value="0"> 时
            <input id="min-minute" type="number" value="3"> 分
            <input id="min-second" type="number" value="0"> 秒
        </div>
        <div class="row">
            最大：
            <input id="max-hour" type="number" value="0"> 时
            <input id="max-minute" type="number" value="5"> 分
            <input id="max-second" type="number" value="0"> 秒
        </div>

    </div>

    <!-- ============================================================
    主操作按钮区
    ============================================================ -->

    <!-- 启动按钮：对当前活动标签页开始自动刷新 -->
    <button id="startBtn">
        启动当前页面刷新
    </button>

    <!-- 停止按钮：停止当前活动标签页的自动刷新 -->
    <button id="stopBtn">
        停止当前页面刷新
    </button>

    <!-- 停止全部按钮：一次性停止所有运行中的刷新任务 -->
    <button id="stopAllBtn">
        停止全部任务
    </button>

    <!-- ============================================================
    任务列表区域
    由 popup.js 动态渲染，显示所有运行中的刷新任务
    每个任务卡片包含：状态、主机名、刷新配置、倒计时、编辑/停止按钮
    ============================================================ -->
    <div class="task-header">
        当前任务
    </div>

    <!-- 任务列表容器，由 popup.js 的 renderTasks() 动态填充 -->
    <div id="taskList"></div>

    <!-- 引入弹出窗口交互脚本 -->
    <script src="popup.js"></script>

</body>

</html>
