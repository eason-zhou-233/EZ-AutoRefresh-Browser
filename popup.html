<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div id="status">
        当前运行任务：0
    </div>
    <div class="mode-card">
        <div class="mode-title">
            刷新模式
        </div>
        <label class="radio-label">
            <input type="radio" name="mode" value="fixed" checked>
            固定时间
        </label>
        <label class="radio-label">
            <input type="radio" name="mode" value="random">
            随机时间
        </label>
    </div>

    <div id="fixed-box" class="config-card">
        <div class="section-title">
            固定时间
        </div>
        <input id="fixed-hour" type="number" min="0" value="0"> 时
        <input id="fixed-minute" type="number" min="0" value="5"> 分
        <input id="fixed-second" type="number" min="0" value="0"> 秒

    </div>

    <div id="random-box" class="config-card" style="display:none">
        <div class="section-title">
            随机时间范围
        </div>
        <div class="row">
            最小：
            <input id="min-hour" type="number" value="0"> 时
            <input id="min-minute" type="number" value="4"> 分
            <input id="min-second" type="number" value="0"> 秒
        </div>
        <div class="row">
            最大：
            <input id="max-hour" type="number" value="0"> 时
            <input id="max-minute" type="number" value="6"> 分
            <input id="max-second" type="number" value="0"> 秒
        </div>

    </div>

    <button id="startBtn">
        启动当前页面刷新
    </button>
    <button id="stopBtn">
        停止当前页面刷新
    </button>
    <button id="stopAllBtn">
        停止全部任务
    </button>
    <div class="task-header">
        当前任务
    </div>

    <div id="taskList"></div>

    <script src="popup.js"></script>

</body>

</html>
